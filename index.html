<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self';"
  />
  <title>ElectronBrowser</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Custom frameless titlebar: tab strip + window controls -->
  <header id="titlebar">
    <div id="tab-strip-wrap">
      <div id="tab-strip"></div>
      <button id="new-tab-btn" title="New Tab (Ctrl+T)" aria-label="New Tab">
        <svg viewBox="0 0 16 16" width="14" height="14"><path d="M8 1v14M1 8h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="drag-spacer"></div>
    <div id="window-controls">
      <button id="min-btn" class="win-btn" title="Minimize" aria-label="Minimize">
        <svg viewBox="0 0 10 10" width="10" height="10"><rect y="4.5" width="10" height="1" fill="currentColor"/></svg>
      </button>
      <button id="max-btn" class="win-btn" title="Maximize" aria-label="Maximize">
        <svg viewBox="0 0 10 10" width="10" height="10"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor"/></svg>
      </button>
      <button id="close-btn" class="win-btn win-btn-close" title="Close" aria-label="Close">
        <svg viewBox="0 0 10 10" width="10" height="10"><path d="M0.5 0.5l9 9M9.5 0.5l-9 9" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
    </div>
  </header>

  <!-- Navigation toolbar -->
  <div id="toolbar">
    <button id="back-btn" class="nav-btn" title="Back (Alt+Left)" aria-label="Back" disabled>
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="forward-btn" class="nav-btn" title="Forward (Alt+Right)" aria-label="Forward" disabled>
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="reload-btn" class="nav-btn" title="Reload (Ctrl+R)" aria-label="Reload">
      <svg id="reload-icon" viewBox="0 0 24 24" width="16" height="16"><path d="M20 11A8 8 0 106.6 16.6M20 11V5M20 11h-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg id="stop-icon" viewBox="0 0 24 24" width="16" height="16" style="display:none"><rect x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor"/></svg>
    </button>
    <button id="home-btn" class="nav-btn" title="Home" aria-label="Home">
      <svg viewBox="0 0 24 24" width="17" height="17"><path d="M3 11l9-8 9 8M5 10v10h14V10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <div id="address-bar-wrap">
      <span id="security-icon" title="Connection info">
        <svg viewBox="0 0 24 24" width="14" height="14"><path d="M6 10V7a6 6 0 1112 0v3M5 10h14v10H5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </span>
      <input
        id="address-bar"
        type="text"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        placeholder="Search Google or type a URL"
      />
    </div>

    <button id="bookmark-btn" class="nav-btn" title="Bookmark this page" aria-label="Bookmark">
      <svg id="bookmark-icon" viewBox="0 0 24 24" width="16" height="16"><path d="M6 3h12v18l-6-4.5L6 21V3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <!-- Active + background webviews live here -->
  <main id="webview-container"></main>

  <div id="favicon-templates" hidden>
    <svg id="default-favicon-svg" viewBox="0 0 24 24" width="16" height="16"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3 12h18M12 3a15 15 0 010 18M12 3a15 15 0 000 18" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
